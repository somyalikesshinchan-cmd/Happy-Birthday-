<!DOCTYPE html>
<html>
    <head><style>
        body{background-color: rgb(180, 46, 69);}
        h1{font-family: cursive;
        color: burlywood;}
        @keyframes slide{
         0%{
            transform:translateX(0vw);
         }
         50%{
            transform:translateX(80vw);
         }
         100%{
            transform:translate(100px);
         }
        }
        .move{
            animation: slide 10s infinite linear;
        }
        h2{color: aquamarine;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;}
    </style></head>
    <body>
        <h1>YAYYYYYYYYYY!Thankyou for your precious time!!! Please share your valuable feedbacks if you liked it!!</h1>
        <div class="move">
            <h2>Sunflowers for you!!</h2>
            <img src="catholdingflowers.jpg" alt="Flowers from a cute cat!">
        </div>
    </body>
</html>
