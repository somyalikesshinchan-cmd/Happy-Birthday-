<!DOCTYPE html>
<html>
    <head><style>
     body{background-color: rgb(82, 13, 13);}
     h1{color: rgb(239, 245, 250);
    text-align: center;
font-family: monospace;}
@keyframes slide{
    0%{
        transform: rotate();
        transform: translateY(0vw);
    }
    50%{
        transform: rotate();
        transform: translateY(80vw);
    }
    100%{
        transform: rotate(100px);
    }
}
.motion{
    display: flex;
    max-width: auto;
    gap:20px;
    animation: slide 10s infinite linear;
}
.right{
    display: flex;
}
    </style></head>
    <body>
        <img src="flowers.gif" alt="flowers">
     <h1>I've got you some flowers!!</h1>
     <div class="motion">
     <img src="cat2.jpg" width="350" class="left" alt="Flowers for ya!">
     <img src="hearts.gif" width="400" class="right" alt="hearts!">
     </div>
    <div class="popup" </body>
</html>
